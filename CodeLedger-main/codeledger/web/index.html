<!doctype html>

<title>CodeLedger — why the AI wrote it</title>

<style>
/* =========================================================================
   CodeLedger design system - single file, no build step, no CDN.
   Order: 1 tokens  2 themes  3 base/reset  4 components  5 layouts
   ========================================================================= */

/* ======================= 1. DESIGN TOKENS (:root) ======================= */
:root {
  /* spacing - 4/8px grid */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;

  /* radius */
  --r-sm: 5px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 999px;

  /* typography - system stacks only (offline) */
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
               "Liberation Mono", "Courier New", monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px;
  --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 27px; --fs-3xl: 34px;
  --lh-tight: 1.25; --lh: 1.5;
  --fw-reg: 400; --fw-med: 500; --fw-semi: 600; --fw-bold: 700;

  /* motion - subtle only */
  --t-fast: 120ms; --t: 160ms; --ease: ease;

  /* layout */
  --sidebar-w: 228px; --topbar-h: 52px; --content-max: 1220px;
  --content-pad: 24px;

  /* elevation */
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.16);
  --shadow-2: 0 6px 24px rgba(0, 0, 0, 0.22);

  /* z-index scale */
  --z-nav: 40; --z-overlay: 60; --z-toast: 80;

  /* placeholder refs (resolved by theme blocks below) */
  --bg: #0b0d12; --surface: #12151c; --surface-2: #171b24;
  --border: #232936; --border-strong: #303849;
  --ink: #e8eaf0; --ink-2: #b9bfd0; --muted: #8b93a7; --faint: #626a7e;
  --accent: #6c8cff; --accent-solid: #4f6ae8; --accent-solid-hover: #5d78f0;
  --accent-ink: #8aa4ff; --accent-soft: rgba(108, 140, 255, 0.14);
  --on-accent: #ffffff;
  --success: #3fb950; --success-soft: rgba(63, 185, 80, 0.13);
  --warning: #d29922; --warning-soft: rgba(210, 153, 34, 0.13);
  --danger: #f85149; --danger-soft: rgba(248, 81, 73, 0.13);
  --human: #7d8596;
  --code-bg: #0f1219; --mark: rgba(255, 255, 255, 0.06);
  --overlay-bg: rgba(4, 6, 10, 0.62);
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  /* syntax tokens */
  --tok-kw: #c792ea; --tok-str: #9ece6a; --tok-com: #6b7385;
  --tok-num: #ff9e64; --tok-fn: #7aa2f7; --tok-type: #2ac3de; --tok-op: #89ddff;
}

/* ============================ 2. THEMES ================================= */
[data-theme="dark"] {
  --bg: #0b0d12; --surface: #12151c; --surface-2: #171b24; --surface-3: #1d222d;
  --border: #232936; --border-strong: #303849;
  --ink: #e8eaf0; --ink-2: #b9bfd0; --muted: #8b93a7; --faint: #626a7e;
  --accent: #6c8cff; --accent-solid: #4f6ae8; --accent-solid-hover: #5d78f0;
  --accent-ink: #8aa4ff; --accent-soft: rgba(108, 140, 255, 0.14);
  --on-accent: #ffffff;
  --success: #3fb950; --success-soft: rgba(63, 185, 80, 0.13);
  --warning: #d29922; --warning-soft: rgba(210, 153, 34, 0.13);
  --danger: #f85149; --danger-soft: rgba(248, 81, 73, 0.13);
  --human: #7d8596;
  --code-bg: #0f1219; --mark: rgba(255, 255, 255, 0.06);
  --overlay-bg: rgba(4, 6, 10, 0.62);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 6px 24px rgba(0, 0, 0, 0.5);
  --tok-kw: #c792ea; --tok-str: #9ece6a; --tok-com: #6b7385;
  --tok-num: #ff9e64; --tok-fn: #7aa2f7; --tok-type: #2ac3de; --tok-op: #89ddff;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f2f4f7; --surface-3: #e9ecf1;
  --border: #e2e5ea; --border-strong: #c9cedb;
  --ink: #171b26; --ink-2: #3d4454; --muted: #5f6779; --faint: #8b93a7;
  --accent: #4c63e6; --accent-solid: #4459db; --accent-solid-hover: #3a4fc9;
  --accent-ink: #3a4fc9; --accent-soft: rgba(76, 99, 230, 0.09);
  --on-accent: #ffffff;
  --success: #17803d; --success-soft: rgba(23, 128, 61, 0.1);
  --warning: #9a6700; --warning-soft: rgba(154, 103, 0, 0.1);
  --danger: #c1372f; --danger-soft: rgba(193, 55, 47, 0.09);
  --human: #6a7280;
  --code-bg: #f6f7f9; --mark: rgba(23, 27, 38, 0.055);
  --overlay-bg: rgba(20, 24, 33, 0.38);
  --shadow-1: 0 1px 2px rgba(23, 27, 38, 0.06), 0 1px 3px rgba(23, 27, 38, 0.05);
  --shadow-2: 0 8px 28px rgba(23, 27, 38, 0.14);
  --tok-kw: #8250df; --tok-str: #0a7c42; --tok-com: #8b93a7;
  --tok-num: #b3541e; --tok-fn: #0550ae; --tok-type: #0a6b82; --tok-op: #0550ae;
  color-scheme: light;
}

/* System-aware pre-boot: before JS resolves the stored preference, follow
   the OS so light-mode users never see a dark flash. */
@media (prefers-color-scheme: light) {
  html[data-theme="dark"]:not(.theme-init) {
    --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f2f4f7; --surface-3: #e9ecf1;
    --border: #e2e5ea; --border-strong: #c9cedb;
    --ink: #171b26; --ink-2: #3d4454; --muted: #5f6779; --faint: #8b93a7;
    --accent: #4c63e6; --accent-solid: #4459db; --accent-solid-hover: #3a4fc9;
    --accent-ink: #3a4fc9; --accent-soft: rgba(76, 99, 230, 0.09);
    --success: #17803d; --success-soft: rgba(23, 128, 61, 0.1);
    --warning: #9a6700; --warning-soft: rgba(154, 103, 0, 0.1);
    --danger: #c1372f; --danger-soft: rgba(193, 55, 47, 0.09);
    --human: #6a7280;
    --code-bg: #f6f7f9; --mark: rgba(23, 27, 38, 0.055);
    --overlay-bg: rgba(20, 24, 33, 0.38);
    --shadow-1: 0 1px 2px rgba(23, 27, 38, 0.06), 0 1px 3px rgba(23, 27, 38, 0.05);
    --shadow-2: 0 8px 28px rgba(23, 27, 38, 0.14);
    --tok-kw: #8250df; --tok-str: #0a7c42; --tok-com: #8b93a7;
    --tok-num: #b3541e; --tok-fn: #0550ae; --tok-type: #0a6b82; --tok-op: #0550ae;
    color-scheme: light;
  }
}

/* ======================= 3. BASE / RESET ================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: var(--fs-base);
  line-height: var(--lh);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color var(--t) var(--ease), color var(--t) var(--ease);
}
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--fs-xl); font-weight: var(--fw-semi); line-height: var(--lh-tight); }
h2 { font-size: var(--fs-lg); font-weight: var(--fw-semi); line-height: var(--lh-tight); }
h3 { font-size: var(--fs-base); font-weight: var(--fw-semi); }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; font-size: inherit; color: inherit; }
code, pre, kbd, samp, .mono {
  font-family: var(--font-mono);
  font-variant-ligatures: none;
}
code { font-size: 0.92em; }
pre { margin: 0; }
ul, ol { margin: 0; padding: 0; }
img, svg { display: block; }
table { border-collapse: collapse; }
hr { border: 0; border-top: 1px solid var(--border); margin: var(--s5) 0; }
::selection { background: var(--accent-soft); }

:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r-sm); }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
.skip-link {
  position: fixed; top: -60px; left: var(--s3); z-index: calc(var(--z-toast) + 1);
  background: var(--accent-solid); color: var(--on-accent);
  padding: var(--s2) var(--s4); border-radius: var(--r-md);
  font-weight: var(--fw-semi); transition: top var(--t) var(--ease);
}
.skip-link:focus { top: var(--s3); text-decoration: none; }

/* Scrollbars: quiet, platform-native-ish */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-full); border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* Motion safety */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}
/* ========================= 4. COMPONENTS ================================= */

/* --- buttons --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  padding: 7px 13px; border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--ink); font-size: var(--fs-md); font-weight: var(--fw-med);
  cursor: pointer; white-space: nowrap;
  transition: background-color var(--t-fast) var(--ease),
              border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active { transform: translateY(0.5px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; cursor: default; pointer-events: none; }
.btn-primary {
  background: var(--accent-solid); border-color: var(--accent-solid);
  color: var(--on-accent);
}
.btn-primary:hover { background: var(--accent-solid-hover); border-color: var(--accent-solid-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.btn-danger:hover { border-color: var(--danger); }
.btn-sm { padding: 4px 9px; font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn-block { width: 100%; }
.btn .icon { flex: none; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0;
  border-radius: var(--r-md); border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.bare { border-color: transparent; background: transparent; }

.linklike {
  background: none; border: 0; padding: 0; color: var(--accent-ink);
  cursor: pointer; font-size: inherit; text-align: left;
}
.linklike:hover { text-decoration: underline; }

/* --- forms --- */
.input, .select, .textarea {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
  font-family: inherit; font-size: var(--fs-md);
  transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--faint); }
.select {
  appearance: none; padding-right: 26px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.select option { background: var(--surface); color: var(--ink); }
.textarea { min-height: 84px; resize: vertical; line-height: var(--lh); }
.input-wrap { position: relative; }
.input-wrap .input { padding-left: 30px; }
.input-wrap .icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.field { display: flex; flex-direction: column; gap: var(--s1); }
.field-label { font-size: var(--fs-sm); font-weight: var(--fw-semi); color: var(--ink-2); }
.field-hint { font-size: var(--fs-sm); color: var(--muted); }

/* --- badges / chips --- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1.5px 8px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: var(--fw-semi); line-height: 1.5;
  border: 1px solid transparent; white-space: nowrap; vertical-align: middle;
}
.badge .dot { width: 6px; height: 6px; border-radius: var(--r-full); background: currentColor; flex: none; }
.b-neutral { background: var(--surface-3); color: var(--ink-2); }
.b-ai { background: var(--accent-soft); color: var(--accent-ink); }
.b-ok { background: var(--success-soft); color: var(--success); }
.b-warn { background: var(--warning-soft); color: var(--warning); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-human { background: var(--surface-3); color: var(--human); }
.b-mono { font-family: var(--font-mono); font-weight: var(--fw-med); letter-spacing: 0.02em; }
.badge-demo { background: var(--warning-soft); color: var(--warning); border-color: var(--warning); letter-spacing: 0.06em; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: var(--fs-sm);
  padding: 2px 8px; border-radius: var(--r-sm);
  background: var(--code-bg); border: 1px solid var(--border);
  color: var(--ink-2); white-space: nowrap;
}
.chip-btn {
  cursor: pointer; font-family: var(--font-ui); font-size: var(--fs-sm);
  background: var(--surface); border: 1px solid var(--border-strong);
  color: var(--ink-2); border-radius: var(--r-full); padding: 3px 11px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.chip-btn:hover { border-color: var(--accent); color: var(--ink); }
.chip-btn[aria-pressed="true"] {
  background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink);
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* --- kbd --- */
kbd, .kbd {
  display: inline-block; min-width: 18px; text-align: center;
  padding: 1px 5px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); border-bottom-width: 2px;
  background: var(--surface-2); color: var(--muted);
  font-family: var(--font-ui); font-size: var(--fs-xs); font-weight: var(--fw-semi);
  line-height: 1.5;
}

/* --- cards --- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  transition: border-color var(--t) var(--ease), background-color var(--t) var(--ease);
}
.card-pad { padding: var(--s5); }
.card-pad-sm { padding: var(--s4); }
.card-hover:hover { border-color: var(--border-strong); }
.card-title { font-size: var(--fs-base); font-weight: var(--fw-semi); }
.card-sub { font-size: var(--fs-sm); color: var(--muted); }
.card-head {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s5); border-bottom: 1px solid var(--border);
  min-height: 46px;
}
.card-head .card-title { margin-right: auto; }
.card-body { padding: var(--s5); }
.card-click { cursor: pointer; text-align: left; width: 100%; }
.card-click:hover { border-color: var(--accent); }

/* --- stat cards --- */
.stat-grid {
  display: grid; gap: var(--s3);
  grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--s4);
}
.stat-label {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.stat-value { font-size: var(--fs-2xl); font-weight: var(--fw-semi); line-height: 1.15; margin-top: 6px; letter-spacing: -0.01em; }
.stat-sub { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
.stat-value .unit { font-size: var(--fs-lg); color: var(--muted); font-weight: var(--fw-med); }

/* --- tables --- */
.table { width: 100%; font-size: var(--fs-md); }
.table th {
  text-align: left; font-size: var(--fs-xs); font-weight: var(--fw-semi);
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border);
}
.table td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--mark); }

/* --- tabs / segmented --- */
.seg {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.seg-item {
  border: 0; background: transparent; color: var(--muted);
  padding: 4px 12px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: var(--fw-med); cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.seg-item:hover { color: var(--ink); }
.seg-item[aria-selected="true"], .seg-item[aria-pressed="true"] {
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1);
}

/* --- tooltip ([data-tip], static text only) --- */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute; left: 50%; bottom: calc(100% + 7px);
  transform: translateX(-50%) translateY(2px);
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--border-strong);
  padding: 4px 9px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: var(--fw-med); line-height: 1.4;
  white-space: pre; pointer-events: none; opacity: 0;
  box-shadow: var(--shadow-2); z-index: var(--z-toast);
  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease);
}
[data-tip]:hover::after, [data-tip]:focus-visible::after {
  opacity: 1; transform: translateX(-50%) translateY(0);
  transition-delay: 350ms;
}
[data-tip-below]::after { bottom: auto; top: calc(100% + 7px); }

/* --- overlays: dialog / palette / help --- */
.overlay {
  position: fixed; inset: 0; z-index: var(--z-overlay);
  background: var(--overlay-bg);
  display: flex; align-items: flex-start; justify-content: center;
  padding: var(--s6) var(--s4);
  backdrop-filter: blur(2px);
}
.overlay.center { align-items: center; }
.dialog {
  width: 100%; max-width: 520px; max-height: min(80vh, 640px);
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--r-xl); box-shadow: var(--shadow-2);
  animation: pop var(--t) var(--ease);
}
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.99); } }
.dialog-head {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s4) var(--s5); border-bottom: 1px solid var(--border);
}
.dialog-head h2 { margin-right: auto; font-size: var(--fs-lg); }
.dialog-body { padding: var(--s5); overflow: auto; display: flex; flex-direction: column; gap: var(--s4); }
.dialog-foot {
  display: flex; justify-content: flex-end; gap: var(--s2);
  padding: var(--s3) var(--s5) var(--s4); border-top: 1px solid var(--border);
}

/* command palette */
.palette { max-width: 580px; }
.palette-input-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border);
}
.palette-input-row .icon { color: var(--muted); flex: none; }
.palette-input {
  flex: 1; border: 0; background: transparent; color: var(--ink);
  font-size: var(--fs-lg); font-family: inherit; padding: 4px 0;
}
.palette-input::placeholder { color: var(--faint); }
.palette-list { overflow: auto; max-height: 380px; padding: var(--s2); }
.palette-group {
  font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: var(--s3) var(--s2) var(--s1);
}
.palette-item {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: 8px 10px; border: 0; border-radius: var(--r-md);
  background: transparent; color: var(--ink); cursor: pointer;
  font-size: var(--fs-md); text-align: left;
}
.palette-item .icon { color: var(--muted); flex: none; }
.palette-item .pi-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item .pi-sub { color: var(--muted); font-size: var(--fs-sm); flex: none; }
.palette-item[aria-selected="true"] { background: var(--accent-soft); }
.palette-item[aria-selected="true"] .icon { color: var(--accent-ink); }
.palette-empty { padding: var(--s6); text-align: center; color: var(--muted); font-size: var(--fs-md); }
.palette-foot {
  display: flex; gap: var(--s4); padding: var(--s2) var(--s4);
  border-top: 1px solid var(--border);
  font-size: var(--fs-xs); color: var(--faint);
}
.palette-foot span { display: inline-flex; gap: 5px; align-items: center; }

/* --- toast --- */
.toasts {
  position: fixed; right: var(--s4); bottom: var(--s4);
  z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--s2);
  max-width: min(380px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: flex-start; gap: var(--s3);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-md); box-shadow: var(--shadow-2);
  padding: var(--s3) var(--s4); font-size: var(--fs-md);
  animation: toast-in var(--t) var(--ease);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
.toast.t-ok { border-left-color: var(--success); }
.toast.t-warn { border-left-color: var(--warning); }
.toast.t-danger { border-left-color: var(--danger); }
.toast .icon { flex: none; margin-top: 1px; }
.toast-msg { flex: 1; }
.toast-x { background: none; border: 0; color: var(--faint); cursor: pointer; padding: 0 2px; }

/* --- banner --- */
.banner {
  display: flex; align-items: center; gap: var(--s3);
  padding: 10px var(--s4); border-radius: var(--r-md);
  border: 1px solid var(--border-strong); background: var(--surface);
  font-size: var(--fs-md); margin-bottom: var(--s4);
}
.banner .icon { flex: none; }
.banner .banner-actions { margin-left: auto; display: flex; gap: var(--s2); }
.banner.info { border-color: var(--accent); background: var(--accent-soft); }
.banner.info .icon { color: var(--accent-ink); }
.banner.warn { border-color: var(--warning); background: var(--warning-soft); }
.banner.warn .icon { color: var(--warning); }
.banner.danger { border-color: var(--danger); background: var(--danger-soft); }
.banner.danger .icon { color: var(--danger); }

/* --- skeleton --- */
.skel {
  border-radius: var(--r-sm); background: var(--surface-3);
  position: relative; overflow: hidden; min-height: 12px;
}
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--mark), transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.skel-line { height: 12px; margin: 8px 0; }
.skel-card { height: 96px; border-radius: var(--r-lg); }
@media (prefers-reduced-motion: reduce) {
  .skel::after { animation: none; background: none; }
}

/* --- empty & error states --- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: var(--s3); padding: var(--s10) var(--s5);
  border: 1px dashed var(--border-strong); border-radius: var(--r-lg);
  background: var(--surface); color: var(--muted);
}
.empty .empty-art { color: var(--faint); }
.empty h3 { color: var(--ink); font-size: var(--fs-lg); }
.empty p { max-width: 460px; font-size: var(--fs-md); }
.empty-actions { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: center; margin-top: var(--s1); }
.cmd {
  display: inline-block; font-family: var(--font-mono); font-size: var(--fs-md);
  background: var(--code-bg); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); padding: 7px 12px; color: var(--ink);
  text-align: left;
}
.cmd-row { display: flex; align-items: center; gap: var(--s2); justify-content: center; flex-wrap: wrap; }
.error-box {
  display: flex; flex-direction: column; gap: var(--s3); align-items: flex-start;
  padding: var(--s4); border: 1px solid var(--danger);
  background: var(--danger-soft); border-radius: var(--r-md);
  color: var(--ink); font-size: var(--fs-md);
}
.error-box .icon { color: var(--danger); }

/* --- progress / ratio bar --- */
.ratio-bar {
  display: flex; height: 14px; width: 100%;
  border-radius: var(--r-full); overflow: hidden;
  background: var(--surface-3); border: 1px solid var(--border);
}
.ratio-bar > span { display: block; height: 100%; transition: width var(--t) var(--ease); }
.ratio-bar .seg-ai { background: var(--accent-solid); }
.ratio-bar .seg-human { background: var(--human); }
.ratio-bar .seg-mixed { background: var(--warning); }
.ratio-bar .seg-unknown { background: var(--surface-3); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s4); font-size: var(--fs-sm); color: var(--muted); }
.legend i {
  display: inline-block; width: 9px; height: 9px; border-radius: 2px;
  margin-right: 6px; vertical-align: baseline;
}
/* ========================== 5. LAYOUTS =================================== */

/* --- app shell: sidebar + main --- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--s4);
  padding: var(--s4) var(--s3);
  background: var(--surface); border-right: 1px solid var(--border);
  transition: background-color var(--t) var(--ease);
}
.brand { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); }
.logo-mark {
  width: 28px; height: 28px; border-radius: var(--r-md); flex: none;
  background: var(--accent-solid); color: var(--on-accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: var(--fw-bold);
}
.brand-name { font-size: var(--fs-lg); font-weight: var(--fw-semi); letter-spacing: -0.01em; }
.brand-sub { font-size: var(--fs-xs); color: var(--muted); padding: 0 var(--s2); margin-top: calc(-1 * var(--s3)); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label {
  font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--faint);
  text-transform: uppercase; letter-spacing: 0.07em;
  padding: var(--s3) var(--s2) var(--s1);
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-md);
  color: var(--ink-2); font-size: var(--fs-md); font-weight: var(--fw-med);
  border: 1px solid transparent; cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.nav-item .icon { color: var(--muted); flex: none; }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.nav-item[aria-current="page"] .icon { color: var(--accent-ink); }
.nav-item .nav-count {
  margin-left: auto; font-size: var(--fs-xs); font-weight: var(--fw-semi);
  background: var(--surface-3); color: var(--muted);
  border-radius: var(--r-full); padding: 0 6px;
}
.nav-item[aria-current="page"] .nav-count { background: var(--surface); color: var(--accent-ink); }

.sidebar-foot {
  margin-top: auto; display: flex; flex-direction: column; gap: var(--s2);
  padding: var(--s3) var(--s2) 0; border-top: 1px solid var(--border);
  font-size: var(--fs-xs); color: var(--faint);
}
.sidebar-foot .row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.kbd-btn {
  border: 1px solid var(--border-strong); background: var(--surface-2);
  color: var(--muted); border-radius: var(--r-sm);
  width: 22px; height: 22px; cursor: pointer; font-size: var(--fs-sm);
}
.kbd-btn:hover { color: var(--ink); border-color: var(--faint); }

/* --- topbar --- */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: var(--z-nav);
  display: flex; align-items: center; gap: var(--s4);
  height: var(--topbar-h); padding: 0 var(--s5);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.crumbs { min-width: 0; flex: 1; }
.crumbs ol { display: flex; align-items: center; gap: var(--s2); list-style: none; flex-wrap: wrap; }
.crumbs li { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-md); min-width: 0; }
.crumbs li + li::before { content: "/"; color: var(--faint); }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--ink); text-decoration: none; }
.crumbs .crumb-current { color: var(--ink); font-weight: var(--fw-semi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs .crumb-mono { font-family: var(--font-mono); font-size: var(--fs-md); }

.topbar-actions { display: flex; align-items: center; gap: var(--s2); }
.search-btn {
  display: flex; align-items: center; gap: var(--s2);
  height: 32px; min-width: 200px; padding: 0 var(--s2) 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background: var(--surface-2); color: var(--faint);
  font-size: var(--fs-md); cursor: pointer;
  transition: border-color var(--t-fast) var(--ease);
}
.search-btn:hover { border-color: var(--accent); color: var(--muted); }
.search-btn .icon { flex: none; }
.search-btn .sb-text { flex: 1; text-align: left; }
.repo-chip {
  display: flex; align-items: baseline; gap: 6px;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2); font-size: var(--fs-sm); min-width: 0;
}
.repo-chip b { font-weight: var(--fw-semi); white-space: nowrap; }
.repo-chip .branch { color: var(--muted); font-family: var(--font-mono); font-size: var(--fs-xs); white-space: nowrap; }

.only-mobile { display: none; }

/* --- content --- */
.content {
  flex: 1; width: 100%; max-width: var(--content-max);
  margin: 0 auto; padding: var(--s6) var(--content-pad) var(--s12);
}
.view { display: flex; flex-direction: column; gap: var(--s5); }
.view-head { display: flex; align-items: flex-start; gap: var(--s4); flex-wrap: wrap; }
.view-head .vh-text { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
.view-head p { color: var(--muted); font-size: var(--fs-md); }
.view-head .vh-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }

/* --- toolbar (filters) --- */
.toolbar {
  display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center;
  padding: var(--s3); border: 1px solid var(--border);
  background: var(--surface); border-radius: var(--r-lg);
}
.toolbar .input-wrap { min-width: 220px; flex: 1 1 240px; }
.toolbar .select { width: auto; min-width: 120px; flex: 0 1 auto; }
.toolbar .spacer { flex: 1; }
.filter-count { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }

/* --- entry cards (timeline) --- */
.entry-list { display: flex; flex-direction: column; gap: var(--s3); list-style: none; }
.entry-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--s4);
  box-shadow: var(--shadow-1); cursor: pointer; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: var(--s2);
  transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}
.entry-card:hover { border-color: var(--border-strong); background: var(--surface-2); }
.entry-card.is-sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ec-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ec-time { margin-left: auto; color: var(--faint); font-size: var(--fs-sm); white-space: nowrap; }
.ec-decision { font-size: var(--fs-base); font-weight: var(--fw-semi); line-height: 1.4; }
.ec-prompt {
  font-size: var(--fs-md); color: var(--muted); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.ec-files { display: flex; flex-wrap: wrap; gap: 6px; }
.ec-rejected {
  border-left: 3px solid var(--danger); padding-left: 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.ec-rejected .lbl {
  font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--danger);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.ec-rejected .it { font-size: var(--fs-sm); color: var(--muted); }
.ec-rejected .it b { color: var(--ink-2); font-weight: var(--fw-med); }
.list-foot { display: flex; justify-content: center; padding: var(--s3) 0; }

/* --- split layout (blame) --- */
.split {
  display: grid; grid-template-columns: minmax(0, 1fr) 372px;
  gap: var(--s4); align-items: start;
}
@media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }

/* --- code viewer --- */
.code-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  overflow: auto; max-height: calc(100vh - 210px); min-height: 240px;
}
.code-card.short { max-height: 380px; }
.code-legend {
  display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center;
  font-size: var(--fs-sm); color: var(--muted);
  padding: var(--s2) var(--s4); border-bottom: 1px solid var(--border);
}
.code-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; }
.code-legend .lg-ai { background: var(--accent); }
.code-legend .lg-human { background: var(--human); }
.code-legend .lg-uncommitted { background: var(--warning); }
.codeview { width: 100%; font-size: var(--fs-md); font-family: var(--font-mono); }
.codeview td { padding: 1px 0; vertical-align: baseline; white-space: pre; }
.codeview .ln {
  position: relative; width: 1%; min-width: 56px; text-align: right;
  padding: 1px 12px 1px 14px; color: var(--faint); user-select: none;
  border-right: 1px solid var(--border); background: var(--code-bg);
  cursor: pointer; font-size: var(--fs-sm);
  transition: background-color var(--t-fast) var(--ease);
}
.codeview .ln:hover { background: var(--mark); }
.codeview .src { padding: 1px 14px; color: var(--ink-2); }
.codeview tr:hover .src { background: var(--mark); }
.codeview tr.is-sel .ln, .codeview tr.is-sel .src { background: var(--accent-soft); }
.codeview tr.is-sel .ln { color: var(--ink); font-weight: var(--fw-med); }
.codeview tr:focus-visible { outline: none; }
.codeview tr:focus-visible .ln { box-shadow: inset 0 0 0 2px var(--accent); }
.codeview .ln::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: transparent; border-radius: 0 2px 2px 0;
}
tr.attr-ai .ln::before { background: var(--accent); }
tr.attr-human .ln::before { background: var(--human); opacity: 0.55; }
tr.attr-uncommitted .ln::before { background: var(--warning); }
tr.attr-mixed .ln::before { background: var(--warning); }
.code-note { padding: var(--s3) var(--s4); font-size: var(--fs-sm); color: var(--muted); border-top: 1px solid var(--border); }

/* syntax tokens */
.tok-kw { color: var(--tok-kw); }
.tok-str { color: var(--tok-str); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-num { color: var(--tok-num); }
.tok-fn { color: var(--tok-fn); }
.tok-type { color: var(--tok-type); }
.tok-op { color: var(--tok-op); }

/* --- side panel (blame aside) --- */
.side-panel {
  position: sticky; top: calc(var(--topbar-h) + var(--s4));
  display: flex; flex-direction: column; gap: var(--s3);
  max-height: calc(100vh - var(--topbar-h) - var(--s8));
  overflow-y: auto;
}
.panel-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.panel-block .pb-head {
  display: flex; align-items: center; gap: var(--s2);
  padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm); font-weight: var(--fw-semi); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.panel-block .pb-head .right { margin-left: auto; text-transform: none; letter-spacing: 0; }
.panel-block .pb-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.why-line {
  background: var(--accent-soft); border: 1px solid var(--accent);
  border-radius: var(--r-md); padding: var(--s3) var(--s4);
  font-size: var(--fs-md); line-height: 1.5; color: var(--ink);
}
.why-line b { font-weight: var(--fw-semi); }
.line-code {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 8px 10px;
  font-family: var(--font-mono); font-size: var(--fs-sm);
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
}
.meta-row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px var(--s3); font-size: var(--fs-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; color: var(--ink-2); word-break: break-word; }
.lbl-sm {
  font-size: var(--fs-xs); font-weight: var(--fw-semi); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em; margin-top: var(--s1);
}
.prose { font-size: var(--fs-md); line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; }
.prose.tight { white-space: normal; }

/* --- section blocks (entry detail, settings) --- */
.sections { display: flex; flex-direction: column; gap: var(--s4); }
.copy-row { display: flex; gap: var(--s2); align-items: center; }
.copy-row .input { font-family: var(--font-mono); font-size: var(--fs-sm); }

/* --- chain (trace) --- */
.chain { display: flex; flex-direction: column; align-items: stretch; gap: 0; list-style: none; }
.chain-node {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--s4);
  box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: var(--s2);
}
.chain-node .cn-kind {
  display: flex; align-items: center; gap: var(--s2);
  font-size: var(--fs-xs); font-weight: var(--fw-semi); text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted);
}
.chain-node .cn-kind .icon { color: var(--accent-ink); }
.chain-node .cn-title { font-size: var(--fs-base); font-weight: var(--fw-semi); }
.chain-node .cn-body { font-size: var(--fs-md); color: var(--ink-2); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.chain-connector {
  align-self: center; width: 2px; height: 22px;
  background: linear-gradient(var(--accent), var(--border-strong));
  position: relative; flex: none;
}
.chain-connector::after {
  content: ""; position: absolute; bottom: -3px; left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 6px; height: 6px; background: var(--border-strong);
}

/* --- memory / notes --- */
.tabs { display: flex; gap: var(--s1); border-bottom: 1px solid var(--border); }
.tab-item {
  border: 0; background: none; cursor: pointer;
  padding: var(--s2) var(--s3); font-size: var(--fs-md); font-weight: var(--fw-med);
  color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: inline-flex; gap: 6px; align-items: center;
}
.tab-item:hover { color: var(--ink); }
.tab-item[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
.lesson-list { display: flex; flex-direction: column; gap: var(--s3); list-style: none; }
.lesson {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--s4);
  display: flex; flex-direction: column; gap: var(--s2);
}
.lesson.is-pinned { border-color: var(--accent); background: var(--accent-soft); }
.lesson-top { display: flex; align-items: flex-start; gap: var(--s2); }
.lesson-top .les-text { flex: 1; font-size: var(--fs-md); font-weight: var(--fw-med); line-height: 1.5; }
.lesson-why { font-size: var(--fs-md); color: var(--muted); line-height: 1.5; }
.lesson-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lesson-foot .spacer { flex: 1; }
.pin-btn { color: var(--faint); }
.pin-btn[aria-pressed="true"] { color: var(--accent-ink); }

/* --- onboarding steps --- */
.steps { display: flex; flex-direction: column; gap: 0; list-style: none; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: var(--s3); padding-bottom: var(--s5); position: relative; }
.step:not(:last-child)::before {
  content: ""; position: absolute; left: 16px; top: 34px; bottom: 0;
  width: 2px; background: var(--border-strong);
}
.step-num {
  width: 34px; height: 34px; border-radius: var(--r-full); flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  font-size: var(--fs-md); font-weight: var(--fw-semi); color: var(--ink-2);
  z-index: 1;
}
.step.done .step-num { background: var(--success-soft); border-color: var(--success); color: var(--success); }
.step-body { display: flex; flex-direction: column; gap: var(--s2); padding-top: 3px; }
.step-body h3 { font-size: var(--fs-base); }
.step-body p { font-size: var(--fs-md); color: var(--muted); }

/* --- charts --- */
.chart-grid { display: grid; gap: var(--s4); grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.chart-card .ct { font-size: var(--fs-md); font-weight: var(--fw-semi); margin-bottom: var(--s3); display: flex; align-items: center; gap: var(--s2); }
.chart-card .ct .right { margin-left: auto; font-size: var(--fs-sm); font-weight: var(--fw-reg); color: var(--muted); }
.svg-chart { width: 100%; height: auto; display: block; overflow: visible; }
.svg-chart text { font-family: var(--font-ui); fill: var(--muted); font-size: 10px; }
.svg-chart .bar-ai { fill: var(--accent-solid); }
.svg-chart .bar-human { fill: var(--human); }
.svg-chart .bar-track { fill: var(--surface-3); }
.svg-chart .bar-row { fill: var(--accent-solid); }
.svg-chart .grid-line { stroke: var(--border); stroke-width: 1; }

.ratio-hero { display: flex; gap: var(--s6); align-items: center; flex-wrap: wrap; }
.ratio-big { display: flex; align-items: baseline; gap: var(--s2); }
.ratio-big .num { font-size: var(--fs-3xl); font-weight: var(--fw-semi); letter-spacing: -0.02em; }
.ratio-big .lbl { font-size: var(--fs-md); color: var(--muted); }
.ratio-main { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: var(--s3); }

.alert-list { display: flex; flex-direction: column; gap: var(--s2); list-style: none; }
.alert-row {
  display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: 10px var(--s3); border: 1px solid var(--border);
  background: var(--surface); border-radius: var(--r-md);
  cursor: pointer; text-align: left; font-size: var(--fs-md); color: var(--ink-2);
  transition: border-color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease);
}
.alert-row:hover { border-color: var(--accent); background: var(--surface-2); text-decoration: none; }
.alert-row .icon { flex: none; }
.alert-row .ar-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-row .ar-meta { color: var(--faint); font-size: var(--fs-sm); flex: none; }
.alert-row.sev-warn .icon { color: var(--warning); }
.alert-row.sev-danger .icon { color: var(--danger); }
.alert-row.sev-info .icon { color: var(--accent-ink); }

.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s4); align-items: start; }
.stack { display: flex; flex-direction: column; gap: var(--s4); }
.stack-sm { display: flex; flex-direction: column; gap: var(--s2); }
.row { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.row-tight { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.semib { font-weight: var(--fw-semi); }
.hidden { display: none !important; }
.center { text-align: center; }
.mono { font-family: var(--font-mono); }
.nowrap { white-space: nowrap; }
.mt2 { margin-top: var(--s2); } .mt3 { margin-top: var(--s3); } .mt4 { margin-top: var(--s4); }
.clip1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- responsive --- */
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: calc(var(--z-overlay) - 1);
    width: min(280px, 84vw); transform: translateX(-105%);
    box-shadow: var(--shadow-2); transition: transform var(--t) var(--ease);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-scrim {
    position: fixed; inset: 0; z-index: calc(var(--z-overlay) - 2);
    background: var(--overlay-bg);
  }
  .only-mobile { display: inline-flex; }
  .search-btn { min-width: 0; }
  .search-btn .sb-text, .search-btn kbd { display: none; }
  .repo-chip { display: none; }
  .content { padding: var(--s4) var(--s4) var(--s10); }
  .topbar { padding: 0 var(--s4); gap: var(--s3); }
}
@media (max-width: 640px) {
  .toolbar .select, .toolbar .input-wrap { flex: 1 1 100%; width: 100%; min-width: 0; }
  .side-panel { position: static; max-height: none; }
  .code-card { max-height: 60vh; }
  .stat-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .ratio-hero { gap: var(--s4); }
  .overlay { padding: var(--s3); }
  .ec-time { margin-left: 0; width: 100%; }
}
@media (min-width: 961px) { .sidebar-scrim { display: none; } }

  }
  nodes.push(chainNode("CODE", "file", "Code it touched",
    (entry.files && entry.files.length) ? fileChips(entry.files, function (f) { return buildHash("blame", { file: f }); }) : "No files recorded.",
    '<span class="small muted">' + (entry.files ? entry.files.length : 0) + " " + plural((entry.files || []).length, "file", "files") + "</span>"));
  nodes.push(chainNode("PROMPT", "search", "The prompt", esc(entry.prompt || "—")));
  nodes.push(chainNode("MODEL", "cpu", "Who wrote it",
    esc(entry.model) + "  ·  " + esc(entry.tool) + "  ·  " + esc(fmtTime(entry.timestamp))));
  var rejected = (entry.rejected_alternatives || []).filter(function (r) { return r && (r.approach || r.reason); });
  nodes.push(chainNode("DECISION", "layers", "Decision & alternatives",

  body.innerHTML = '<ol class="chain">' + nodes.map(function (n, i) {
    return "<li>" + n + (i < nodes.length - 1 ? chainConnector() : "") + "</li>";

}

/* ------------------------------ MEMORY ------------------------------ */
function memNotes() { return storeGet("cl.notes", []); }
function memSaveNotes(list) { storeSet("cl.notes", list); }
function lessonRows() {
  var map = {};
  ((state.entries && state.entries.entries) || []).forEach(function (e) {
    (e.rejected_alternatives || []).forEach(function (r) {
      if (!r || !r.approach) return;
      var key = r.approach.trim().toLowerCase();
      if (!map[key]) map[key] = { key: key, approach: r.approach.trim(), reason: r.reason || "", ids: [], ts: e.timestamp };
      if (map[key].ids.indexOf(e.id) === -1) map[key].ids.push(e.id);
      if (!map[key].reason && r.reason) map[key].reason = r.reason;
      if (e.timestamp > map[key].ts) map[key].ts = e.timestamp;
    });
  });
  var rows = Object.keys(map).map(function (k) { return map[k]; });
  rows.sort(function (a, b) {
    var pa = state.ui.memPins[a.key] ? 1 : 0, pb = state.ui.memPins[b.key] ? 1 : 0;
    if (pa !== pb) return pb - pa;
    if (b.ids.length !== a.ids.length) return b.ids.length - a.ids.length;
    return a.ts < b.ts ? 1 : -1;
  });
  return rows;
}

/* =========================== ACTIONS ================================= */
var ACTIONS = {
  "refresh-overview": function () { state.overview = null; render(); },
  "refresh-entries": function () { state.entries = null; render(); },
  "open-palette": function () { openPalette(); },
  "setup": function () { navigate("setup"); },
  "tl-clear": tlClearFilters,
  "tl-more": function () { state.ui.tlShown += 30; paintTimeline(); },
  "tl-retry": function () { render(); },
  "entry-retry": function () { render(); },
  "tr-retry": function () { render(); },
  "mem-retry": function () { render(); },
  "bl-retry": function () {
    if (state.blame.file) loadBlame(state.blame.file, state.blame.sel || 0);
    else render();
  },
  "bl-reselect": function () { if (state.blame.sel) selectLine(state.blame.sel, false, false); },
  "capsule-retry": function () { state.capsule = null; render(); },
  "capsule-refresh": function () { state.capsule = null; render(); toast("Regenerating capsule…", "ok"); },
  "capsule-copy": function () {
    ensureCapsule().then(function (c) {
      if (!c || c.missing || !c.text) { toast("No capsule yet — run ledger capsule.", "warn"); return null; }
      return copyText(c.text);
    }).then(function (ok) {
      if (ok !== null) toast(ok ? "Capsule copied — paste it into any AI tool." : "Copy failed", ok ? "ok" : "danger");
    });
  },
  "copy-cmd": function (arg) {
    copyText(arg).then(function (ok) { toast(ok ? "Command copied." : "Copy failed", ok ? "ok" : "danger"); });
  },
  "copy-entry-context": function (arg) {
    var e = findEntry(arg);
    if (!e) { toast("Entry " + arg + " not loaded yet.", "warn"); return; }
    copyText(contextMarkdown(e)).then(function (ok) {
      toast(ok ? "Context for " + arg + " copied — paste it into any AI tool." : "Copy failed", ok ? "ok" : "danger");
    });
  },
  "copy-entry-id": function (arg) {
    copyText(arg).then(function (ok) { toast(ok ? "Entry id copied." : "Copy failed", ok ? "ok" : "danger"); });
  },
  "copy-text": function (arg) {
    var e = state.currentEntry;
    if (!e) { toast("Open an entry first.", "warn"); return; }
    var text = arg === "commit" ? (e.commit || "") : (e.prompt || "");
    copyText(text).then(function (ok) {
      toast(ok ? (arg === "commit" ? "Commit copied." : "Prompt copied.") : "Copy failed", ok ? "ok" : "danger");
    });
  },
  "trace-commit": function (arg) {
    var list = (state.entries && state.entries.entries) || [];
    var found = list.filter(function (e) { return e.commit && e.commit.indexOf(arg) === 0; })[0];
    if (found) navigate("trace", { entry: found.id });
    else { toast("No ledger entry for commit " + arg, "warn"); navigate("trace", { commit: arg }); }
  },
  "set-theme": function (arg) { setTheme(arg); },
  "demo-on": function () { setDemo(true); },
  "demo-off": function () { setDemo(false); },
  "demo-toggle": function () { setDemo(!state.ui.demo); },
  "mem-tab": function (arg) {
    state.ui.memTab = arg;
    $$("[data-action='mem-tab']").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-arg") === arg));
      b.setAttribute("aria-selected", String(b.getAttribute("data-arg") === arg));
    });
    paintMemory();
  },
  "mem-clear": function () { state.ui.memFilter = ""; render(); },
  "les-pin": function (arg) {
    var pins = state.ui.memPins || {};
    if (pins[arg]) delete pins[arg]; else pins[arg] = true;
    state.ui.memPins = pins;
    storeSet("cl.pins", pins);
    paintMemory();
  },
  "les-copy": function (arg) {
    var l = lessonRows().filter(function (r) { return r.key === arg; })[0];
    if (!l) return;
    copyText("Don't do this again — " + l.approach + (l.reason ? " (" + l.reason + ")" : "")).then(function (ok) {
      toast(ok ? "Lesson copied." : "Copy failed", ok ? "ok" : "danger");
    });
  },
  "note-new": function () { openNoteDialog(null); },
  "note-edit": function (arg) { openNoteDialog(arg); },
  "note-pin": function (arg) {
    var list = memNotes().map(function (n) {
      return n.id === arg ? { id: n.id, title: n.title, body: n.body, ts: n.ts, pinned: !n.pinned } : n;
    });
    memSaveNotes(list);
    paintMemory();
  },
  "note-delete": function (arg) {
    var note = memNotes().filter(function (n) { return n.id === arg; })[0];
    if (!note) return;
    openConfirm({
      title: "Delete note?", body: note.title, okLabel: "Delete", danger: true,
      onOk: function () {
        memSaveNotes(memNotes().filter(function (n) { return n.id !== arg; }));
        paintMemory();
        toast("Note deleted.", "ok");
      }
    });
  }
};
function onDocClick(ev) {
  var t = ev.target;
  if (!t || !t.closest) return;
  var closeBtn = t.closest("[data-close-dialog]");
  if (closeBtn) {
    var ov = closeBtn.closest(".overlay");
    if (ov && ov.id === "dialog") closeDialog();
    else if (ov) closeOverlayEl(ov);
    return;
  }
  var actionEl = t.closest("[data-action]");
  if (actionEl) {
    var name = actionEl.getAttribute("data-action");
    if (ACTIONS[name]) {
      ev.preventDefault();
      ACTIONS[name](actionEl.getAttribute("data-arg") || "", actionEl, ev);
      return;
    }
  }
  var palItem = t.closest(".palette-item");
  if (palItem) { runPaletteItem(parseInt(palItem.getAttribute("data-i"), 10)); return; }
  if (t.closest("#sidebar-scrim")) { toggleSidebar(false); return; }
  var card = t.closest("[data-entry]");
  if (card && !t.closest("a[href]")) {
    navigate("entry", { id: card.getAttribute("data-entry") });
  }
}
function routeMove(delta) {
  if (state.route.name === "timeline") tlMove(delta);
  else if (state.route.name === "blame") codeMove(delta);
}
var gPendingAt = 0;
function onDocKey(ev) {
  var k = ev.key;
  if ((ev.metaKey || ev.ctrlKey) && !ev.altKey && (k === "k" || k === "K")) {
    ev.preventDefault();
    openPalette();
    return;
  }
  if (k === "Escape") { if (closeTopOverlay()) ev.preventDefault(); return; }
  var tag = (ev.target && ev.target.tagName) || "";
  var typing = /^(input|textarea|select)$/i.test(tag) || (ev.target && ev.target.isContentEditable);
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (palette.open) return;
  if (k === "?") { ev.preventDefault(); openHelp(); return; }
  if (k === "/") {
    ev.preventDefault();
    var q = $("#tl-q");
    if (q) q.focus(); else openPalette();
    return;
  }
  if (k === "j") { ev.preventDefault(); routeMove(1); return; }
  if (k === "k") { ev.preventDefault(); routeMove(-1); return; }
  if (k === "Enter" && state.route.name === "timeline") { ev.preventDefault(); tlOpenSelected(); return; }
  if (k === "g") { gPendingAt = Date.now(); return; }
  if (gPendingAt && Date.now() - gPendingAt < 900) {
    var navMap = { o: "overview", t: "timeline", b: "blame", r: "trace", m: "memory", c: "capsule", s: "settings", a: "setup" };
    gPendingAt = 0;
    if (navMap[k]) { ev.preventDefault(); navigate(navMap[k]); return; }
    // unknown letter after g: fall through to normal single-key handling
  }
  if (k === "t") { cycleTheme(); return; }
}
function paletteKeydown(ev) {
  if (ev.key === "ArrowDown") { ev.preventDefault(); movePalette(1); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); movePalette(-1); }
  else if (ev.key === "Enter") { ev.preventDefault(); runPaletteItem(palette.sel); }
  else if (ev.key === "Escape") { ev.preventDefault(); closePalette(); }
}

/* ============================= INIT ================================== */
function init() {
  state.ui.theme = resolveThemePref();
  state.ui.demo = !!storeGet("cl.demo", false);
  state.ui.memPins = storeGet("cl.pins", {});
  applyTheme();

  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: light)");
    var onScheme = function () { if (state.ui.theme === "system") applyTheme(); };
    if (mq.addEventListener) mq.addEventListener("change", onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  $("#menu-btn").addEventListener("click", function () { toggleSidebar(); });
  $("#theme-btn").addEventListener("click", cycleTheme);
  $("#search-btn").addEventListener("click", function () { openPalette(); });
  $("#help-btn").addEventListener("click", openHelp);
  $("#palette-input").addEventListener("input", function () { palette.sel = 0; rebuildPalette(); });
  $("#palette-input").addEventListener("keydown", paletteKeydown);

  [["#palette", closePalette], ["#help", function () { closeOverlayEl($("#help")); }], ["#dialog", closeDialog]]
    .forEach(function (pair) {
      var el = $(pair[0]);
      el.addEventListener("click", function (ev) { if (ev.target === el) pair[1](); });
    });

  window.addEventListener("hashchange", render);
  document.addEventListener("click", onDocClick);
  document.addEventListener("keydown", onDocKey);

  render();
  loadHealth().then(renderChrome).catch(function () {
    showBanner({ kind: "danger", html: "Cannot reach the local CodeLedger server. Run <code>ledger ui</code> in a repo, then reload." });
  });
  loadEntries().catch(function () { /* per-view error states handle it */ });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
